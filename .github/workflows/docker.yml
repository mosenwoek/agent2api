name: docker

# 构建网关镜像（amd64 + arm64）并推送到 Docker Hub。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · 推 main 分支：产出 :dev 与 :latest
#     （个人 fork 的 main 就是「当前在用的那一份」：VPS 用 compose 拉
#      :latest 即可，不用手动改 tag。dev 留着给「想回退到上一版」用）
#   · 推送 v* tag（如 v3.1.0）：产出 <版本号> 与 :latest
#   · 推送带预发布后缀的 v* tag（如 v3.1.0-beta.1）：只产出
#     <版本号>（3.1.0-beta.1），**不移动 :latest**（理由见下面生成 tag 那一步）
#   · 手动 workflow_dispatch：产出 :dev（移动测试 tag，不碰正式 tag）
#
# ── 为什么 runner 上不用装 QEMU ───────────────────────────────
# Dockerfile 的 builder 固定跑在 $BUILDPLATFORM：runner 是 amd64，arm64
# 走 aarch64 工具链交叉编译。本地与 CI 同一套交叉编译路径，无需
# setup-qemu-action，也没有 QEMU 模拟下 Rust 编译慢几十倍的问题。
#
# ── 缓存 ─────────────────────────────────────────────────────
# type=gha 把 BuildKit 缓存挂到 Actions cache：Dockerfile 的「桩依赖层」
# 首次编完整棵依赖树后落缓存，之后每次构建直接命中，只剩源码层重编。
#
# ── action 版本 ──────────────────────────────────────────────
# 与 build.yml 同一标准：直接钉最新大版本。截至本次编写：
# setup-buildx v4 / login v4 / metadata v6 / build-push v7，
# login v4 起已默认 Node 24 运行时，无 Node 20 弃用问题。
#
# ── secrets ──────────────────────────────────────────────────
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Read & Write 权限的 Access Token）

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE: mosenwoek/agent2api

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag 推送：v3.1.0 → 3.1.0 + latest；main 分支 → dev + latest；
      # 手动触发：只出 dev
      #
      # latest **只跟正式版走**：beta tag（v3.1.0-beta.1）带 `-`，不移动 latest ——
      # 应用里的「加入 beta 版」是一次显式选择，而 `docker pull :latest` 的人没做
      # 这个选择；推一次 beta 就把 :latest 换掉等于绕过那道开关。beta 镜像照旧
      # 会出 3.1.0-beta.1 这个版本 tag，想尝鲜的按版本号拉即可。
      #
      # main 分支也移动 latest：这是个人 fork，main 就是「当前在用的那一份」，
      # VPS 的 compose 拉 :latest 就能拿到改后的镜像，不必手动改 tag。
      # 上游（aimodcc）的仓库没有这条规则 —— 它靠 tag 发版。
      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) }}
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
