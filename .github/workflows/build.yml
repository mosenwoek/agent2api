name: build

# Build the Windows NSIS installer as a workflow artifact. Release publication
# stays separate and is handled by scripts/release.sh after the run finishes.
on:
  workflow_dispatch:
  push:
    branches:
      - ci-test   # CI 预演分支：验证 build job 可跑，验证完删除
    tags:
      - 'v*'

env:
  RUST_BACKTRACE: 1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: Install desktop dependencies
        run: npm --prefix desktop-tauri ci

      - name: Build Windows installer
        run: npm --prefix desktop-tauri run build

      # 裸 exe（绿色单文件版）：Tauri 打 NSIS 包时它已经在
      # target/release/ 下，直接多传一份，release.sh 挂 Release 用
      - name: Locate bare exe
        id: bare
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/*.exe |
            Where-Object { $_.Name -notlike '*-setup*' -and $_.Name -notlike '*.patch' } |
            Select-Object -First 1
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload bare exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bare-exe
          path: ${{ steps.bare.outputs.path }}
          if-no-files-found: error

  # ── Linux headless 服务器二进制（amd64）─────────────────────
  # agent2api-server 是纯 headless crate（无 tauri/GTK 依赖），ubuntu
  # runner 原生编译即可，不需要交叉工具链。arm64 走 docker 镜像线
  # （Dockerfile 里 aarch64 交叉编译），这里不出，避免双份维护。
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: Build headless server
        run: cargo build --release -p agent2api-server
        working-directory: desktop-tauri/src-tauri

      # target-dir 由 .cargo/config.toml 统一到仓库根 target/
      - name: Pack tar.gz + sha256
        run: |
          BIN=target/release/agent2api-server
          [ -f "$BIN" ] || { echo "找不到 $BIN"; exit 1; }
          mkdir -p pack/agent2api-server-linux-amd64
          cp "$BIN" pack/agent2api-server-linux-amd64/
          cp README.md pack/agent2api-server-linux-amd64/ 2>/dev/null || true
          tar -czf agent2api-server-linux-amd64.tar.gz -C pack agent2api-server-linux-amd64
          sha256sum agent2api-server-linux-amd64.tar.gz > agent2api-server-linux-amd64.tar.gz.sha256

      - name: Upload linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-server-amd64
          path: |
            agent2api-server-linux-amd64.tar.gz
            agent2api-server-linux-amd64.tar.gz.sha256
          if-no-files-found: error
